name: ci
on:
  push:
  pull_request:
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree
        run: ./bump.sh --check
      - name: YAML parses
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('winget/*.yaml')]"
      - name: XML parses
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('choco/rl-lang.nuspec')"
      - name: Shell syntax
        run: bash -n bump.sh
